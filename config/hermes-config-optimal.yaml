    domains: []
    shared_files: []
  acked_advisories: []
  allow_lazy_installs: false

# ============================================================
# SLACK / DISCORD / TELEGRAM
# ============================================================
slack:
  require_mention: true
  free_response_channels: ''
  allowed_channels: ''
  channel_prompts: {}

discord:
  require_mention: true
  free_response_channels: ''
  allowed_channels: ''
  auto_thread: true
