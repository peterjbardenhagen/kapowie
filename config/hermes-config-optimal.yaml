# ============================================================
# PLUGINS
# ============================================================
plugins:
  disabled: []
  enabled:
    - browser-firecrawl
    - hermes-relay

# ============================================================
# SESSION RESET
# ============================================================
session_reset:
  at_hour: 4
  idle_minutes: 1440
  mode: both

# ============================================================
# VIDEO GENERATION
# ============================================================
video_gen:
